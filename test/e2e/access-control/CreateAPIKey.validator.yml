desc: "旧 access-control-manage のリクエスト検証（CreateAPIKey.validator.spec.ts の 75 件）。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-access-control-manage-service/blob/3aabd9ad922bdad35133d3955d53b0a545bdc4fa/src/tests/CreateAPIKey.validator.spec.ts。記録した要求と応答を写した（スタブ・モックなし）"
runners:
  acm: __FUNADANSU_E2E_ACM_URL__
steps:
