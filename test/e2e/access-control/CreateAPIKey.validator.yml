        post:
          headers:
            "content-type": "application/json"
            "accept": "application/json"
            "connection": "close"
          body:
            text/plain: ""
    test: "current.res.status == 400 && len(current.res.body) == 2 && current.res.body[\"status\"] == 400 && len(current.res.body[\"reasons\"]) == 2 && len(current.res.body[\"reasons\"][0]) == 3 && current.res.body[\"reasons\"][0][\"property\"] == \"caller\" && current.res.body[\"reasons\"][0][\"value\"] == nil && current.res.body[\"reasons\"][0][\"message\"] == \"この値は必須値です\" && len(current.res.body[\"reasons\"][1]) == 3 && current.res.body[\"reasons\"][1][\"property\"] == \"target\" && current.res.body[\"reasons\"][1][\"value\"] == nil && current.res.body[\"reasons\"][1][\"message\"] == \"この値は必須値です\""
