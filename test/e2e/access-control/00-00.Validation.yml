            "connection": "close"
          body:
            application/json: [{"caller":{"blockCode":1111111,"apiUrl":"/book-manage/{userId}/contract","apiMethod":"GET","userId":"xxx_yyy.pxr-root","apiCode":"0abdbf81-686c-423b-823a-ac0d889b0ae6","operator":{"type":0,"loginId":null},"requestBody":{"auth":{"member":{"update":true,"delete":true}}}},"target":{"blockCode":2222222,"apiUrl":"/operator/11111","apiMethod":"POST"}}]
