desc: "旧 access-control の試験（00-00.Validation.spec.ts）。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-access-control-service/blob/5cd2d6a/src/tests/00-00.Validation.spec.ts （スタブ・モックなし）。試験は前のデータを前提に続けて流すため、1 本のシナリオに順番どおり並べた"
runners:
  ac: __FUNADANSU_E2E_AC_URL__
  db: __FUNADANSU_E2E_AC_DB__
steps:
  - desc: "1. Access Control Service トークン取得API 配列ではない"
    ac:
      "/access-control/token":
        post:
          headers:
            "content-type": "application/json"
            "accept": "application/json"
            "connection": "close"
          body:
            application/json: {"caller":{"blockCode":1111111,"apiUrl":"/book-manage/{userId}/contract","apiMethod":"GET","userId":"xxx_yyy.pxr-root","apiCode":"0abdbf81-686c-423b-823a-ac0d889b0ae6","operator":{"type":0,"loginId":"xxx_yyy.pxr-root"},"requestBody":{"auth":{"member":{"update":true,"delete":true}}}},"target":{"blockCode":2222222,"apiUrl":"/operator/11111","apiMethod":"PUT"}}
    test: "current.res.status == 400 && current.res.body == fromJSON(\"{\\\"status\\\":400,\\\"message\\\":\\\"配列ではありません\\\"}\")"
