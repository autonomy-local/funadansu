desc: "旧 access-control の試験（02-01.AccessControl.spec.ts）。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-access-control-service/blob/5cd2d6a/src/tests/02-01.AccessControl.spec.ts （スタブ・モックなし）。試験は前のデータを前提に続けて流すため、1 本のシナリオに順番どおり並べた"
runners:
  ac: __FUNADANSU_E2E_AC_URL__
  db: __FUNADANSU_E2E_AC_DB__
