desc: 旧 operator の 削除（別のユーザーからのリクエスト）。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-operator-service/blob/453e6385a7545be45d6dccc284004457cb8d28f6/src/tests/05-03.OperatorDelete.RequestFromAnotherUser.spec.ts
runners:
  op: http://127.0.0.1:3000
  db: {{ env.FUNADANSU_E2E_OPERATOR_DB }}
steps:
  - desc: 前提の初期化（initialData.sql と同じ内容）
    db:
      query: |
        DELETE FROM pxr_operator.sms_verification_code;
        DELETE FROM pxr_operator.session;
        DELETE FROM pxr_operator.one_time_login_code;
        DELETE FROM pxr_operator.role_setting;
        DELETE FROM pxr_operator.operator;
        DELETE FROM pxr_operator.login_history;
        DELETE FROM pxr_operator.password_history;
        DELETE FROM pxr_operator.user_information;
        DELETE FROM pxr_operator.manage_block_info;
  - desc: オペレーター1（root_member01）、2（member01）、3（member02）を入れる
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, pxr_id, user_information, name, mobile_phone, mail, auth, last_login_at, password_changed_flg, login_prohibited_flg, attributes, lock_flg, lock_start_at, password_updated_at, user_id, app_catalog_code, wf_catalog_code, region_catalog_code, client_id, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES
        (1, 3, 'root_member01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', null, '{}', '流通制御運営メンバー01', null, null, '{"member":{"add":true,"update":true,"delete":true}}', '2020-09-01 12:53:09.784', false, false, '{}', false, null, '2020-09-01 00:00:00.000', null, null, null, null, null, false, 'pxr_user', '2020-09-01 00:00:00.000', 'root_member01', '2020-09-01 00:00:00.000', 'root_member013'),
        (2, 0, 'member01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', 'pxrId1', '{}', null, null, null, '{}', null, false, false, '{"initialPasswordExpire":"2030-01-01T00:00:00.000"}', false, null, '2020-09-01 00:00:00.000', null, null, null, null, null, false, 'root_member01', '2020-09-01 00:00:00.000', 'root_member01', '2020-09-01 00:00:00.000', 'member010'),
        (3, 0, 'member02', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', 'pxrId2', '{}', null, null, null, '{}', null, false, false, '{"initialPasswordExpire":"2030-01-01T00:00:00.000"}', false, null, '2020-09-01 00:00:00.000', null, null, null, null, null, false, 'root_member01', '2020-09-01 00:00:00.000', 'root_member01', '2020-09-01 00:00:00.000', 'member020')
  - desc: member01 のセッションを入れる
    db:
      query: |
        INSERT INTO pxr_operator.session VALUES ('86d7eb745a94d6a6f95e9ffba4398fc37962144a7c2f50884df3d09d49b0b0b2', 2, '2030-09-01 00:00:00.000', false, 'member01', '2020-09-01 00:00:00.000', 'member01', '2020-09-01 00:00:00.000')
  - desc: 異常系：別のユーザー（運営以外）から削除のリクエストは 401
    op:
      /operator/3:
        delete:
          headers:
            Content-Type: application/json
            accept: application/json
    test: |
      current.res.status == 401 &&
      current.res.body.status == 401 &&
      current.res.body.message == 'セッションが有効ではありません'
