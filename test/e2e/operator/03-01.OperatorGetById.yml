desc: 旧 operator の 取得（オペレーターID指定）。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-operator-service/blob/453e6385a7545be45d6dccc284004457cb8d28f6/src/tests/03-01.OperatorGetById.spec.ts
runners:
  op: http://127.0.0.1:3000
  db: __FUNADANSU_E2E_OPERATOR_DB__
steps:
  - desc: 前提の初期化（initialData.sql と同じ内容）
    db:
      query: |
        DELETE FROM pxr_operator.sms_verification_code;
        DELETE FROM pxr_operator.session;
        DELETE FROM pxr_operator.one_time_login_code;
        DELETE FROM pxr_operator.role_setting;
        DELETE FROM pxr_operator.operator;
        DELETE FROM pxr_operator.login_history;
        DELETE FROM pxr_operator.password_history;
        DELETE FROM pxr_operator.user_information;
        DELETE FROM pxr_operator.manage_block_info;
  - desc: オペレーター1（manage_member01）を入れる
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, name, auth, last_login_at, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (1, 3, 'manage_member01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー01', '{"add": true, "update": true, "delete": true}', '2020-01-10 23:59:59.000', '{"test":"test"}', false, 'test_user', NOW(), 'test_user', NOW(), 'manage_member013')
  - desc: 正常：オペレーター1を、pxrRoot のセッションで取得
    op:
      /operator/1:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            session: '{"sessionId":"sessionId","operatorId":1,"type":3,"loginId":"loginid","name":"test-user","mobilePhone":"0311112222","auth":{"member":{"add":true,"update":true,"delete":true}},"lastLoginAt":"2020-01-01T00:00:00.000+0900","attributes":{},"roles":[{"_value":1,"_ver":1}],"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
    test: |
      current.res.status == 200 &&
      current.res.body.operatorId == 1 &&
      current.res.body.loginId == 'manage_member01' &&
      current.res.body.passwordChangedFlg == false
  - desc: 正常：Cookie の operator_type0_session からの取得（セッションを入れる）
    db:
      query: |
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e00', 1, '2030-12-31T00:00:00.000+0000', false, 'test_user', NOW(), 'test_user', NOW())
  - desc: 正常：Cookie の operator_type0_session から取得
    op:
      /operator/1:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            Cookie: operator_type0_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e00
    test: current.res.status == 200 && current.res.body.operatorId == 1
  - desc: 正常：Cookie の operator_type2_session から取得
    op:
      /operator/1:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            Cookie: operator_type2_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e00
    test: current.res.status == 200 && current.res.body.operatorId == 1
  - desc: 正常：Cookie の operator_type3_session から取得
    op:
      /operator/1:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e00
    test: current.res.status == 200 && current.res.body.operatorId == 1
  - desc: データ不足：登録されていない ID は 204
    op:
      /operator/999999:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            session: '{"sessionId":"sessionId","operatorId":1,"type":3,"loginId":"loginid","name":"test-user","mobilePhone":"0311112222","auth":{"member":{"add":true,"update":true,"delete":true}},"lastLoginAt":"2020-01-01T00:00:00.000+0900","attributes":{},"roles":[{"_value":1,"_ver":1}],"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
    test: current.res.status == 204
  - desc: パラメータ異常：ID が数字でない場合は 400
    op:
      /operator/a:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            session: '{"sessionId":"sessionId","operatorId":1,"type":3,"loginId":"loginid","name":"test-user","mobilePhone":"0311112222","auth":{"member":{"add":true,"update":true,"delete":true}},"lastLoginAt":"2020-01-01T00:00:00.000+0900","attributes":{},"roles":[{"_value":1,"_ver":1}],"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
    test: current.res.status == 400
  - desc: パラメータ異常：ID の指定なしは 400 と決まったメッセージ
    op:
      /operator/:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            session: '{"sessionId":"sessionId","operatorId":1,"type":3,"loginId":"loginid","name":"test-user","mobilePhone":"0311112222","auth":{"member":{"add":true,"update":true,"delete":true}},"lastLoginAt":"2020-01-01T00:00:00.000+0900","attributes":{},"roles":[{"_value":1,"_ver":1}],"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
    test: |
      current.res.status == 400 &&
      current.res.body.status == 400 &&
      current.res.body.message == '必要なクエリパラメーターがすべて未設定です'
  - desc: 異常：自分以外かつ運営メンバー以外のセッションは 401
    op:
      /operator/999999:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            session: '{"sessionId":"sessionId","operatorId":1,"type":0,"loginId":"loginid","name":"test-user","mobilePhone":"0311112222","auth":{"member":{"add":true,"update":true,"delete":true}},"lastLoginAt":"2020-01-01T00:00:00.000+0900","attributes":{},"roles":[{"_value":1,"_ver":1}],"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
    test: current.res.status == 401
  - desc: 異常：外部からのヘッダーのログイン情報は 401
    op:
      /operator/1:
        get:
          headers:
            accept: application/json
            Content-Type: application/json
            session: '%7B%22sessionId%22%3A%22494a44bb97aa0ef964f6a666b9019b2d20bf05aa811919833f3e0c0ae2b09b38%22%2C%22operatorId%22%3A1%2C%22type%22%3A3%2C%22loginId%22%3A%22test-user%22%2C%22name%22%3A%22test-user%22%2C%22mobilePhone%22%3A%220311112222%22%2C%22auth%22%3A%7B%22member%22%3A%7B%22add%22%3Atrue%2C%22update%22%3Atrue%2C%22delete%22%3Atrue%7D%7D%2C%22lastLoginAt%22%3A%222020-01-01T00%3A00%3A00.000%2B0900%22%2C%22attributes%22%3A%7B%7D%2C%22roles%22%3A%5B%7B%22_value%22%3A1%2C%22_ver%22%3A1%7D%5D%2C%22block%22%3A%7B%22_value%22%3A1000112%2C%22_ver%22%3A1%7D%2C%22actor%22%3A%7B%22_value%22%3A1000001%2C%22_ver%22%3A1%7D%7D'
            host: root.pxrstd.pxrsrc.me.uk
            x-amzn-trace-id: Root=1-63ef4df1-0522cd53689dcada211daf8b
    test: |
      current.res.status == 401 &&
      current.res.body.message == '未ログイン状態でのリクエストはエラーです'
