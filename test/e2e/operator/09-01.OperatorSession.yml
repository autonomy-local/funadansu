desc: 旧 operator の セッション確認。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-operator-service/blob/453e6385a7545be45d6dccc284004457cb8d28f6/src/tests/09-01.OperatorSession.spec.ts。前提：catalog のスタブ（ポート 3001）を別に立てる
runners:
  op: __FUNADANSU_E2E_OPERATOR_URL__
  db: __FUNADANSU_E2E_OPERATOR_DB__
steps:
  - desc: 前提の初期化（initialData.sql と同じ内容）
    db:
      query: |
        DELETE FROM pxr_operator.sms_verification_code;
        DELETE FROM pxr_operator.session;
        DELETE FROM pxr_operator.one_time_login_code;
        DELETE FROM pxr_operator.role_setting;
        DELETE FROM pxr_operator.operator;
        DELETE FROM pxr_operator.login_history;
        DELETE FROM pxr_operator.password_history;
        DELETE FROM pxr_operator.user_information;
        DELETE FROM pxr_operator.manage_block_info;
  - desc: データ異常：有効なオペレーターが存在しない（無効のオペレーター 2 とセッション）
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, name, auth, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (2, 3, 'manage_member02', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー02', '{"member": {"add": true, "update": true, "delete": true}}', '{"member": {"add": true, "update": true, "delete": true}}', true, 'test_user', NOW(), 'test_user', NOW(), 'manage_member023');
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('00e58ec076ac2ca5c59509e9420e759ef022b9af08c7d06710b8d74a4ed43333', 2, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: データ異常：無効なオペレーターのセッションは 401
    op:
      /operator/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              sessionId: 00e58ec076ac2ca5c59509e9420e759ef022b9af08c7d06710b8d74a4ed43333
    test: current.res.status == 401 && current.res.body.message == '未ログインです'
  - desc: 正常（無効なセッションID）の前提：期限切れのセッション（2019）を入れる
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, name, auth, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (1, 3, 'manage_member01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー01', '{"member": {"add": true, "update": true, "delete": true}}', '{"test": true}', false, 'test_user', NOW(), 'test_user', NOW(), 'manage_member013');
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('12e58ec076ac2ca5c59509e9420e759ef022b9af08c7d06710b8d74a4ed43333', 1, '2019-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 正常（無効なセッションID）：期限切れは 401 と「有効期限切れです」
    op:
      /operator/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              sessionId: 12e58ec076ac2ca5c59509e9420e759ef022b9af08c7d06710b8d74a4ed43333
    test: current.res.status == 401 && current.res.body.message == '有効期限切れです'
  - desc: 正常（運営メンバー）の前提：セッション 437a…e11
    db:
      query: |
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 1, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 正常（運営メンバー）：セッションの確認は 200 と運営メンバーの情報
    op:
      /operator/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              sessionId: 437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
    test: |
      current.res.status == 200 &&
      current.res.body.operatorId == 1 &&
      current.res.body.loginId == 'manage_member01' &&
      current.res.body.passwordChangedFlg == false
  - desc: 正常（個人）の前提：個人（5）とセッション 1212…e11
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, pxr_id, name, auth, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (5, 0, 'ind01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', 'test.pxrid', NULL, NULL, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'ind010');
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('121212bc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 5, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 正常（個人）：個人のセッション確認は 200 と pxrId
    op:
      /operator/ind/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type0_session=121212bc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              sessionId: 121212bc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
              extendFlg: true
    test: |
      current.res.status == 200 &&
      current.res.body.operatorId == 5 &&
      current.res.body.loginId == 'ind01' &&
      current.res.body.pxrId == 'test.pxrid' &&
      current.res.body.passwordChangedFlg == false
  - desc: 正常（app）の前提：app のオペレーター（3）、ロール、セッション 123a…e11
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, name, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (3, 2, 'app_staff01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', NULL, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'app_staff011');
        INSERT INTO pxr_operator.role_setting (operator_id, role_catalog_code, role_catalog_version, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES (3, 43, 1, false, 'test_user', NOW(), 'test_user', NOW());
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 3, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 正常（app）：セッションの確認は 200 と app のオペレーター
    op:
      /operator/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              sessionId: 123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
              extendFlg: true
    test: current.res.status == 200 && current.res.body.operatorId == 3 && current.res.body.loginId == 'app_staff01' && current.res.body.passwordChangedFlg == false
  - desc: 正常（appロールなし）の前提：app のオペレーター（4）、有効 29 分のセッション
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, name, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (4, 2, 'app_staff02', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', NULL, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'app_staff022');
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e12', 4, NOW() + interval '29 minutes', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 正常（appロールなし）：セッションの確認は 200 と app のオペレーター
    op:
      /operator/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              sessionId: 123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e12
              extendFlg: true
    test: current.res.status == 200 && current.res.body.operatorId == 4 && current.res.body.loginId == 'app_staff02' && current.res.body.passwordChangedFlg == false
  - desc: 異常（wf）の前提：wf のオペレーター（7）、ロール、セッション 123a…e13
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, name, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (7, 1, 'wf_staff01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', NULL, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'wf_staff011');
        INSERT INTO pxr_operator.role_setting (operator_id, role_catalog_code, role_catalog_version, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES (7, 43, 1, false, 'test_user', NOW(), 'test_user', NOW());
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e13', 7, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 異常（wf）：未サポートのオペレーター種別は 400
    op:
      /operator/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              sessionId: 123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e13
              extendFlg: true
    test: current.res.status == 400 && current.res.body.message == '未サポートのオペレータ種別です'
  - desc: 異常（個人）：Cookie なしは 401
    op:
      /operator/ind/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              sessionId: 121212bc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
    test: current.res.status == 401 && current.res.body.message == '未ログインです'
  - desc: 異常（個人）の前提：個人（6）、セッション c17a…db
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, pxr_id, name, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (6, 0, 'ind02', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', 'test.pxrid', NULL, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'ind020');
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('c17aeeafd492c5da95ed52ced225b2deae274aa09a19634b8d2171e6065bb9db', 6, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 異常（個人）：Cookie のセッションIDとリクエストのセッションIDが異なるは 401
    op:
      /operator/ind/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type0_session=c17aeeafd492c5da95ed52ced225b2deae274aa09a19634b8d2171e6065bb9db
          body:
            application/json:
              sessionId: 121212bc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
    test: current.res.status == 401 && current.res.body.message == '未ログインです'
  - desc: パラメーター異常（空文字の sessionId）は 400 と理由
    op:
      /operator/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              sessionId: ''
    test: |
      current.res.status == 400 &&
      len(current.res.body.reasons) == 1 &&
      current.res.body.reasons[0].property == 'sessionId' &&
      current.res.body.reasons[0].message == 'この値は空を期待しません'
