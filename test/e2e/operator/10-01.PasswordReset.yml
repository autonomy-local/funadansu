desc: 旧 operator の パスワードリセット。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-operator-service/blob/453e6385a7545be45d6dccc284004457cb8d28f6/src/tests/10-01.PasswordReset.spec.ts。前提：catalog のスタブ（ポート 3001）を別に立てる
runners:
  op: http://127.0.0.1:3000
  db: __FUNADANSU_E2E_OPERATOR_DB__
steps:
  - desc: 前提の初期化（initialData.sql と同じ内容）
    db:
      query: |
        DELETE FROM pxr_operator.sms_verification_code;
        DELETE FROM pxr_operator.session;
        DELETE FROM pxr_operator.one_time_login_code;
        DELETE FROM pxr_operator.role_setting;
        DELETE FROM pxr_operator.operator;
        DELETE FROM pxr_operator.login_history;
        DELETE FROM pxr_operator.password_history;
        DELETE FROM pxr_operator.user_information;
        DELETE FROM pxr_operator.manage_block_info;
  - desc: 正常（Cookie）の前提：運営（1, 3, 2, 4）、個人（2）、ワークフロー（99）、セッション
    db:
      query: |
        INSERT INTO pxr_operator.operator (id, type, login_id, hpassword, name, auth, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (1, 3, 'manage_member01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー01', '{"member": {"add": true, "update": true, "delete": true}}', NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'manage_member013'),
               (2, 0, 'ind01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', NULL, NULL, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'ind010'),
               (3, 3, 'manage_member02', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー02', '{"member": {"add": false, "update": false, "delete": false}}', NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'manage_member023'),
               (4, 3, 'manage_member03', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー03', '{"member": {"add": false, "update": false, "delete": false}}', NULL, true, 'test_user', NOW(), 'test_user', NOW(), 'manage_member033'),
               (99, 1, 'workflow_member99', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', NULL, NULL, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'workflow_member991');
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 1, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW()),
               ('123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 3, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW()),
               ('567a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 2, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW()),
               ('789a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 4, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 正常（Cookie）：運営メンバー（追加権限有）で、オペレーター 2 のパスワードを変える
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202950
    test: current.res.status == 200
  - desc: 異常：セッションの有効期限切れの前提（2020）
    db:
      query: |
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('2212d4a969f24f5e341470c546006d6552d1aa3c0cf60abc3002c5b29143c1ca', 1, '2020-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 異常：セッション有効期限切れは 401
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=2212d4a969f24f5e341470c546006d6552d1aa3c0cf60abc3002c5b29143c1ca
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202945
    test: current.res.status == 401 && current.res.body.message == '有効期限切れです'
  - desc: 正常（header）：運営メンバー（追加権限有）で、header の session を使う
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            session: '{"sessionId":"437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11","operatorId":1,"type":3,"loginId":"mng_member","name":"mng_member","auth":{"member":{"add":true,"update":true,"delete":true}},"lastLoginAt":"2020-01-01 00:00:00.000+0900","attributes":{},"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202945
    test: current.res.status == 200
  - desc: 正常：対象が個人以外のオペレーター種別（ワークフロー 99）
    op:
      /operator/password/99:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202950
    test: current.res.status == 200
  - desc: 異常（header）：運営メンバー以外（個人 2）は 401
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            session: '{"sessionId":"567a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11","operatorId":2,"type":0,"loginId":"ind01","pxrId":"ind01","lastLoginAt":"2020-01-01 00:00:00.000+0900","attributes":{},"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
    test: current.res.status == 401 && current.res.body.message == 'この操作をするための権限がありません'
  - desc: 異常（header）：追加権限が無い（運営 3）は 401
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            session: '{"sessionId":"123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11","operatorId":3,"type":3,"loginId":"manage_member02","name":"manage_member02","auth":{"member":{"add":false,"update":true,"delete":true}},"lastLoginAt":"2020-01-01 00:00:00.000+0900","attributes":{},"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
    test: current.res.status == 401 && current.res.body.message == 'この操作をするための権限がありません'
  - desc: 異常（Cookie）：運営メンバーでログインしていない（Cookie なし）は 401
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
    test: current.res.status == 401 && current.res.body.message == 'パスワードリセットに失敗しました'
  - desc: 異常（Cookie）：運営メンバーが無効（オペレーター 4 のセッション）は 401
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=789a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
    test: current.res.status == 401 && current.res.body.message == 'パスワードリセットに失敗しました'
  - desc: 異常（Cookie）：追加権限が無い（運営 3 のセッション）は 401
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=123a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
    test: current.res.status == 401 && current.res.body.message == 'この操作をするための権限がありません'
  - desc: 異常：対象のオペレーター（4）が存在しない場合は 400
    op:
      /operator/password/4:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202941
    test: current.res.status == 400 && current.res.body.message == '対象のオペレーターが存在しません'
  - desc: 異常：前回と同じパスワードは 400
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            session: '{"sessionId":"437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11","operatorId":1,"type":3,"loginId":"mng_member","name":"mng_member","auth":{"member":{"add":true,"update":true,"delete":true}},"lastLoginAt":"2020-01-01 00:00:00.000+0900","attributes":{},"block":{"_value":1000110,"_ver":1},"actor":{"_value":1000001,"_ver":1}}'
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202945
    test: current.res.status == 400 && current.res.body.message == '過去に使用されたパスワードです'
  - desc: パラメータ不足：operatorId（末尾が空）は 400
    op:
      /operator/password/:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
    test: |
      current.res.status == 400 &&
      len(current.res.body.reasons) == 1 &&
      current.res.body.reasons[0].property == 'operatorId' &&
      current.res.body.reasons[0].value == 'password' &&
      current.res.body.reasons[0].message == '数値ではありません'
  - desc: パラメータ異常：operatorId が数字以外（a）は 400
    op:
      /operator/password/a:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
    test: |
      current.res.status == 400 &&
      len(current.res.body.reasons) == 1 &&
      current.res.body.reasons[0].property == 'operatorId' &&
      current.res.body.reasons[0].value == 'a' &&
      current.res.body.reasons[0].message == '数値ではありません'
  - desc: パラメータ不足：newHpassword（oldHpassword のみ）は 400 と理由 2 件
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              oldHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
    test: |
      current.res.status == 400 &&
      len(current.res.body.reasons) == 2 &&
      current.res.body.reasons[0].property == 'newHpassword' &&
      current.res.body.reasons[0].message == 'この値はハッシュである必要があります' &&
      current.res.body.reasons[1].message == 'この値は空を期待しません'
  - desc: パラメータ異常：newHpassword が空文字は 400 と理由 2 件
    op:
      /operator/password/2:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: ''
    test: |
      current.res.status == 400 &&
      len(current.res.body.reasons) == 2 &&
      current.res.body.reasons[0].message == 'この値はハッシュである必要があります' &&
      current.res.body.reasons[1].message == 'この値は空を期待しません'
  - desc: 異常：ログイン禁止フラグが true のオペレーター（1）は 400。初期化してから、ID を指定せずに入れる
    db:
      query: |
        DELETE FROM pxr_operator.session;
        DELETE FROM pxr_operator.operator;
        INSERT INTO pxr_operator.operator (type, login_id, hpassword, name, auth, login_prohibited_flg, attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id)
        VALUES (3, 'manage_member01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー01', '{"member": {"add": true, "update": true, "delete": true}}', true, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'manage_member013'),
               (0, 'ind01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', NULL, NULL, false, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'ind010'),
               (3, 'manage_member02', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー02', '{"member": {"add": false, "update": false, "delete": false}}', false, NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'manage_member023'),
               (3, 'manage_member03', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー03', '{"member": {"add": false, "update": false, "delete": false}}', false, NULL, true, 'test_user', NOW(), 'test_user', NOW(), 'manage_member033');
        INSERT INTO pxr_operator.session (id, operator_id, expire_at, is_disabled, created_by, created_at, updated_by, updated_at)
        VALUES ('437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 1, '2025-01-27 23:59:59.000', false, 'test_user', NOW(), 'test_user', NOW());
  - desc: 異常：ログイン禁止のオペレーター（1）は 400
    op:
      /operator/password/1:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11
          body:
            application/json:
              newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202950
    test: current.res.status == 400 && current.res.body.message == '対象のオペレーターはログインが許可されていません'
