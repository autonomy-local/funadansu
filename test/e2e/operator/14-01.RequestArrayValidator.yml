desc: 旧 operator の リクエストボディが配列のときのバリデーション（配列は 400）。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-operator-service/blob/453e6385a7545be45d6dccc284004457cb8d28f6/src/tests/14-01.RequestArrayValidator.spec.ts。元のテストは DB を初期化してから動かすが、この 400 は DB に触る前に返るため、初期化の手順は省いている。identifyCode は元のテストで文字列を送っているが、ここでは配列を送る（runn が文字列のボディを引用符付きで送るため）
runners:
  op: __FUNADANSU_E2E_OPERATOR_URL__
steps:
  - desc: バリデーションエラー：パスワード更新
    op:
      /operator/password/1:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - newHpassword: ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：オペレーター追加
    op:
      /operator:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - type: 3
                loginId: mng_menber00
                hpassword: 5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8
                name: 運営メンバー00
                auth:
                  member:
                    add: true
                    update: true
                    delete: true
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：オペレーター更新
    op:
      /operator/1:
        put:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - loginId: ind01_update
                hpassword: 5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8
                newHpassword: cd08374a2f7d9827ac1e592e497bf0268b0d2af4a84e1d55c690348012202948
                mobilePhone: '09099998888'
                attributes:
                  initialPasswordExpire: '2030-01-01T00:00:00.000+09:00'
                  smsAuth: true
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：ログイン
    op:
      /operator/login:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - hpassword: ca978112ca1bbdcafac231b39a23dc4da786eff8147c4e72b9807785afee48bb
                loginId: '123'
                type: 0
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：個人ログイン
    op:
      /operator/ind/login:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - type: 0
                loginId: root_ind_member04
                hpassword: 5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：ワンタイムログイン
    op:
      /operator/ind/login/onetime:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - loginCode: '123456'
                loginId: '123'
                type: 0
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：セッション確認
    op:
      /operator/session:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - sessionId: a
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：利用者登録
    op:
      /operator/user/info:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - pxrId: agent
                userInfo:
                  _code:
                    _value: 1000373
                    _ver: 1
                  item-group:
                    - title: 氏名
                      item:
                        - title: 姓
                          type:
                            _value: 30019
                            _ver: 1
                          content: サンプル
                        - title: 名
                          type:
                            _value: 30020
                            _ver: 1
                          content: 太郎
                    - title: 性別
                      item:
                        - title: 性別
                          type:
                            _value: 30021
                            _ver: 1
                          content: 男
                    - title: 生年
                      item:
                        - title: 生年
                          type:
                            _value: 1000372
                            _ver: 1
                          content: 2000
                    - title: 住所（行政区）
                      item:
                        - title: 住所（行政区）
                          type:
                            _value: 1000371
                            _ver: 1
                          content: 東京都港区
                    - title: 連絡先電話番号
                      item:
                        - title: 連絡先電話番号
                          type:
                            _value: 30036
                            _ver: 1
                          content: 080-1234-5678
                          changable-flag: true
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：利用者情報複数取得
    op:
      /operator/user/info/list:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - pxrId:
                  - test-0001
                  - test-0002
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
  - desc: バリデーションエラー：本人性確認コード登録
    op:
      /operator/identifyCode:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json:
              - identifyCode: test_identify_code_001
                expirationAt: '2100-01-01 00:00:00+0900'
    test: |
      current.res.status == 400 &&
      len(current.res.body) == 2 &&
      current.res.body.status == 400 &&
      current.res.body.message == 'リクエストが配列です'
