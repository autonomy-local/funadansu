desc: "旧 operator の SMS 検証コード検証。元のテスト：https://github.com/Personal-Data-Linkage-Module/pxr-operator-service/blob/453e6385a7545be45d6dccc284004457cb8d28f6/src/tests/16-02.IndSmsVerificateVerifiy.spec.ts。元の beforeAll（initialData.sql と INSERT）は最初の db ステップで行う。元のテストは期限 2025-01-27 のセッションを使うため、今日（2026）の日付では期限切れで赤になるものがある（D-004）"
runners:
  op: http://127.0.0.1:3000
  db: __FUNADANSU_E2E_OPERATOR_DB__
steps:
  - desc: "前提の初期化（initialData.sql と beforeAll の INSERT）"
    db:
      query: |
        DELETE FROM pxr_operator.sms_verification_code;
        DELETE FROM pxr_operator.session;
        DELETE FROM pxr_operator.one_time_login_code;
        DELETE FROM pxr_operator.role_setting;
        DELETE FROM pxr_operator.operator;
        DELETE FROM pxr_operator.login_history;
        DELETE FROM pxr_operator.password_history;
        DELETE FROM pxr_operator.user_information;
        DELETE FROM pxr_operator.manage_block_info;
        
        SELECT SETVAL('pxr_operator.sms_verification_code_id_seq', 1, false);
        SELECT SETVAL('pxr_operator.operator_id_seq', 1, false);
        SELECT SETVAL('pxr_operator.role_setting_id_seq', 1, false);
        SELECT SETVAL('pxr_operator.login_history_id_seq', 1, false);
        SELECT SETVAL('pxr_operator.password_history_id_seq', 1, false);
        SELECT SETVAL('pxr_operator.one_time_login_code_id_seq', 1, false);
        SELECT SETVAL('pxr_operator.user_information_id_seq', 1, false);
        SELECT SETVAL('pxr_operator.manage_block_info_id_seq', 1, false);
        INSERT INTO pxr_operator.operator
                    (
                        id, type, login_id, hpassword, name, auth,
                        attributes, is_disabled, created_by, created_at, updated_by, updated_at, unique_check_login_id
                    )
                    VALUES
                    (
                        1, 3, 'manage_member01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', '運営メンバー01', '{"member": {"add": true, "update": true, "delete": true}}',
                        NULL, false, 'test_user', NOW(), 'test_user', NOW(), 'manage_member013'
                    ),
                    (
                        2, 0, 'ind01', '5e884898da28047151d0e56f8dc6292773603d0d6aabbdd62a11ef721d1542d8', NULL, '{"member": {"add": true, "update": true, "delete": true}}',
                        '{"initialPasswordExpire": "2030-01-01T00:00:00.000+09:00"}', false, 'test_user', NOW(), 'test_user', NOW(), 'ind010'
                    );
                    INSERT INTO pxr_operator.session
                    (
                        id, operator_id, expire_at,
                        is_disabled, created_by, created_at, updated_by, updated_at
                    )
                    VALUES
                    (
                        '00e58ec076ac2ca5c59509e9420e759ef022b9af08c7d06710b8d74a4ed43333', 1, '2025-01-27 23:59:59.000',
                        false, 'test_user', NOW(), 'test_user', NOW()
                    ),
                    (
                        '437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11', 2, '2025-01-27 23:59:59.000',
                        false, 'test_user', NOW(), 'test_user', NOW()
                    );
                    INSERT INTO pxr_operator.sms_verification_code
                    (
                        operator_id,
                        verification_code,
                        verification_code_expiration,
                        verification_result,
                        created_by,
                        updated_by
                    )
                    VALUES
                    (
                        2,
                        '123456',
                        NOW() + INTERVAL '10 MINUTE',
                        1,
                        'ind01',
                        'ind01'
                    );
  - desc: "正常"
    op:
      /operator/ind/sms-verificate/verifiy:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: "operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11"
          body:
            application/json: {"smsVerificationCode":"123456"}
    test: |
      current.res.status == 200 &&
      len(current.res.body) == 1 &&
      current.res.body["result"] == "success"
  - desc: "パラメータ不足：smsVerificationCode"
    op:
      /operator/ind/sms-verificate/verifiy:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json: {}
    test: |
      current.res.status == 400
  - desc: "パラメータ異常：リクエストが配列"
    op:
      /operator/ind/sms-verificate/verifiy:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json: [{"smsVerificationCode":"123456"}]
    test: |
      current.res.status == 400
  - desc: "パラメータ異常：smsVerificationCode（空）"
    op:
      /operator/ind/sms-verificate/verifiy:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json: {"smsVerificationCode":null}
    test: |
      current.res.status == 400
  - desc: "パラメータ異常：smsVerificationCode（文字列以外）"
    op:
      /operator/ind/sms-verificate/verifiy:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
          body:
            application/json: {"smsVerificationCode":123456}
    test: |
      current.res.status == 400
  - desc: "対象のSMS検証コードが存在しない"
    op:
      /operator/ind/sms-verificate/verifiy:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: "operator_type3_session=437a5cbc10da802a887f5e057c88fdc64a927332871ad2a987dfcb7d224e7e11"
          body:
            application/json: {"smsVerificationCode":"123456"}
    test: |
      current.res.status == 400 &&
      current.res.body.message == "対象のSMS検証コードが存在しません"
  - desc: "オペレーターが個人以外"
    op:
      /operator/ind/sms-verificate/verifiy:
        post:
          headers:
            accept: application/json
            Content-Type: application/json
            Connection: close
            Cookie: "operator_type3_session=00e58ec076ac2ca5c59509e9420e759ef022b9af08c7d06710b8d74a4ed43333"
          body:
            application/json: {"smsVerificationCode":"123456"}
    test: |
      current.res.status == 401 &&
      current.res.body.message == "この操作をするための権限がありません"
