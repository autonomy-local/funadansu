            "cookie": "operator_type3_session=cf930faf40d879b87a550d59f26fa4d5c788bb45fa9c94cee6c597608cb46acc"
            "connection": "close"
          body:
            application/json: {"id":"a","region":{"code":1000011,"version":1},"actor":{"code":1000021,"version":1,"app":[{"code":1000021,"version":1}]},"isDraft":false}
    test: "current.res.status == 400 && current.res.body == fromJSON(\"{\\\"status\\\":400,\\\"reasons\\\":[{\\\"property\\\":\\\"id\\\",\\\"value\\\":\\\"a\\\",\\\"message\\\":\\\"数値ではありません\\\"}]}\")"
