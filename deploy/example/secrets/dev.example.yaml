# 見本。実際の dev.yaml は sops で暗号化したものを置く（この見本は暗号化されていない）。
# キーの一覧だけを示す。値は入れない。
jwt_kid: <kid>            # 署名の鍵の識別子（ADR-0011 の方式にすると、署名の鍵は認証の単位だけが持つ）
jwt_key: <値>             # 署名の鍵（秘密）。検証の鍵は JWKS で公開する
database_url: <値>        # 当座の DB 接続（Cloud SQL の IAM 認証に移したら、この行は消す）
cloudflare_api_token: <値> # CI・デプロイ用の最小の権限のトークン
backup_key: <値>          # バックアップの暗号化の鍵（VPS の場合）
